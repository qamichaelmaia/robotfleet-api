databases:
  - name: robot-fleet-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: robot-fleet-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        fromDatabase:
          name: robot-fleet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: '900'
      - key: JWT_REFRESH_EXPIRES_IN
        value: '604800'
      - key: CORS_ORIGIN
        value: '*'
      - key: RATE_LIMIT_MAX
        value: '100'
      - key: RATE_LIMIT_WINDOW
        value: '60000'
      - key: AUTH_RATE_LIMIT_MAX
        value: '5'
      - key: AUTH_RATE_LIMIT_WINDOW
        value: '60000'
