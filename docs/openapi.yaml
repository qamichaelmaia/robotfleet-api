                          - ACTIVE
                      - type: string
                        enum:
                          - INACTIVE
                      - type: string
                        enum:
                          - SUSPENDED
                  createdAt:
                    format: date-time
                    type: string
                  updatedAt:
                    format: date-time
                    type: string
                required:
                  - id
                  - name
                  - email
                  - role
                  - status
                  - createdAt
                  - updatedAt
