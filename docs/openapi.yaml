                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
  /api/v1/qa-scenarios/delay:
    get:
      summary: "[Lab] Simulates a slow response"
      tags:
        - QA Scenarios
      parameters:
        - schema:
            minimum: 0
            maximum: 10000
            default: 2000
            type: integer
          in: query
          name: ms
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  delayedMs:
                    type: integer
                required:
                  - delayedMs
  /api/v1/qa-scenarios/error:
    get:
      summary: "[Lab] Simulates a 500 Internal Server Error"
      tags:
        - QA Scenarios
      responses:
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  code:
                    type: string
                  detail:
                    type: string
                  traceId:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                  - detail
                  - traceId
  /api/v1/qa-scenarios/rate-limit:
    get:
      summary: "[Lab] Enforces a strict rate limit (3 requests per minute) to practice
        429 handling"
      tags:
        - QA Scenarios
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
  /api/v1/qa-scenarios/large-payload:
    get:
      summary: "[Lab] Returns a large payload to practice performance/pagination
        handling"
      tags:
        - QA Scenarios
      parameters:
        - schema:
            minimum: 1
            maximum: 10000
            default: 1000
            type: integer
          in: query
          name: items
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        value:
                          type: string
                      required:
                        - index
                        - value
                required:
                  - data
