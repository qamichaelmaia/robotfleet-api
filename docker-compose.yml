services:
  postgres:
    image: postgres:16-alpine
    container_name: robot-fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robot_fleet
    ports:
      - '5432:5432'
    volumes:
      - robot-fleet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robot-fleet-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/robot_fleet?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_EXPIRES_IN: 900
      JWT_REFRESH_EXPIRES_IN: 604800
      CORS_ORIGIN: '*'
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW: 60000
      AUTH_RATE_LIMIT_MAX: 5
      AUTH_RATE_LIMIT_WINDOW: 60000
    ports:
      - '3000:3000'
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/src/server.js"

  # Reserved for future evolution (V4 Event Contracts / resilience testing).
  # rabbitmq:
  #   image: rabbitmq:3-management-alpine
  #   ports: ['5672:5672', '15672:15672']
  # redis:
  #   image: redis:7-alpine
  #   ports: ['6379:6379']

volumes:
  robot-fleet-postgres-data:
